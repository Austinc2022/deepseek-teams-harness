<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company dashboard</title>
<style>
/* Layout: a read-only status board. Headline numbers, then the business units and when they worked,
   then what happens next, then trends, then operating performance. The desk (index.html) is where you act. */
:root {
  --bg: #f3f5f4; --panel: #ffffff; --ink: #17211e; --muted: #5d6b66; --line: #d6dedb; --soft: #e9eeec; --grid: #e4e9e7;
  --accent: #8a5a12; --good: #1f7a4d; --warn: #a86400; --bad: #b3261e; --info: #2c5d8f;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111715; --panel: #18201d; --ink: #e6ece9; --muted: #94a39d; --line: #2a3531; --soft: #202a26; --grid: #26302c;
  --accent: #e0a94a; --good: #55c08a; --warn: #e3a441; --bad: #f0766c; --info: #7fb0e0;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111715; --panel: #18201d; --ink: #e6ece9; --muted: #94a39d; --line: #2a3531; --soft: #202a26; --grid: #26302c;
  --accent: #e0a94a; --good: #55c08a; --warn: #e3a441; --bad: #f0766c; --info: #7fb0e0;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em }
h2 { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650 }
h3 { font-size: 14px; margin: 0; font-weight: 650 }
p { margin: 0 }
a { color: var(--info) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) } .small { font-size: 12px }
header.top { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between }
header.top p { color: var(--muted); max-width: 80ch }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap }
.kpis { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)) }
.kpi .big { font: 600 28px/1.1 var(--mono); font-variant-numeric: tabular-nums }
.bar { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--accent); min-width: 2px }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted) }
.pill.good::before { background: var(--good) } .pill.warn::before { background: var(--warn) } .pill.bad::before { background: var(--bad) } .pill.info::before { background: var(--info) }
.pill.good { border-color: var(--good) } .pill.bad { border-color: var(--bad) } .pill.warn { border-color: var(--warn) } .pill.info { border-color: var(--info) }
.units { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)) }
.unit { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.unit.working { border-color: var(--info) }
.unit .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap }
.unit .w { overflow-wrap: anywhere }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)) }
.grid3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)) }
.chart { width: 100%; min-width: 0 }
.chart svg { display: block; width: 100%; overflow: visible }
.chart text { font: 11px var(--sans); fill: var(--muted) }
.chart text.v { fill: var(--ink); font-family: var(--mono) }
.chart .hit { fill: transparent; cursor: default }
.scroll { overflow-x: auto }
.empty { color: var(--muted); font-size: 12px }
details { font-size: 12px } details summary { cursor: pointer; color: var(--muted) }
table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 6px }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line) } td.r, th.r { text-align: right }
th { color: var(--muted); font-weight: 600 }
ol, ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.seg button { font: inherit; font-size: 12px; border: 0; background: var(--panel); color: var(--ink); padding: 3px 10px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--soft); font-weight: 650 }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.facts { display: grid; gap: 10px 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)) }
.facts div { display: flex; flex-direction: column }
.facts .v { font: 600 18px/1.2 var(--mono); font-variant-numeric: tabular-nums }
#tip { position: fixed; z-index: 5; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; white-space: pre-line; max-width: 320px }

.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px }
.crumbs button { font: inherit; border: 0; background: none; color: var(--info); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px }
.crumbs span.cur { font-weight: 650 }
.treewrap { overflow-x: auto; padding-bottom: 6px }
.tree { display: inline-block; min-width: 100% }
.tree ul { display: flex; flex-direction: row; gap: 0; justify-content: center; align-items: flex-start; list-style: none; margin: 0; padding: 18px 0 0; position: relative }
.tree > ul { padding-top: 0 }
.tree li { display: flex; flex-direction: column; align-items: center; position: relative; padding: 18px 4px 0 }
.tree > ul > li { padding-top: 0 }
.tree li::before, .tree li::after { content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 18px; border-top: 1px solid var(--muted) }
.tree li::after { right: auto; left: 50%; border-left: 1px solid var(--muted) }
.tree li:only-child::before, .tree li:only-child::after { border-top: 0 }
.tree li:first-child::before, .tree li:last-child::after { border-top: 0 }
.tree li:last-child::before { border-right: 1px solid var(--muted) }
.tree li:last-child::after { border-left: 0 }
.tree > ul > li::before, .tree > ul > li::after { display: none }
.tree ul ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 18px; border-left: 1px solid var(--muted) }
.tree.compact ul.leaf { flex-direction: column; align-items: center; padding-top: 8px }
.tree.compact ul.leaf > li { padding: 10px 0 0 }
.tree.compact ul.leaf > li::before { content: ""; display: block; top: 0; left: 50%; right: auto; width: 0; height: 10px; border: 0; border-left: 1px solid var(--muted) }
.tree.compact ul.leaf > li::after { display: none }
.tree.compact li { padding-left: 3px; padding-right: 3px }
.tree.compact .node { width: 150px }
.treewrap.overflow::after { content: "Wider than the window: scroll sideways to see every box."; display: block; font-size: 12px; color: var(--muted); padding-top: 6px; position: sticky; left: 0 }
.node { font: inherit; color: var(--ink); text-align: left; width: 162px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; position: relative }
.node:hover { border-color: var(--muted) } .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.node.working { border-color: var(--info); box-shadow: 0 0 0 1px var(--info) }
.node.blocked { border-color: var(--bad) }
.node.you { cursor: default; background: var(--soft); width: auto; align-items: center; padding: 6px 14px }
.node .nt { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 6px }
.node .nm { font-weight: 650; overflow-wrap: anywhere; line-height: 1.25 }
.node .wk { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em }
.node .kp { font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.node svg { display: block; max-width: 100% }
#view { display: flex; flex-direction: column; gap: 16px }
.steps { display: grid; grid-template-columns: repeat(8, minmax(96px, 1fr)); gap: 0; overflow-x: auto; padding-bottom: 4px }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; position: relative; padding: 0 6px; font-size: 12px }
.step::before { content: ""; position: absolute; top: 15px; left: -50%; width: 100%; height: 3px; background: var(--soft) }
.step:first-child::before { display: none }
.step.done::before, .step.next::before { background: var(--s3) }
.step .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--mono); background: var(--panel); border: 2px solid var(--line); color: var(--muted); position: relative; z-index: 1 }
.step.done .dot { background: var(--s3); border-color: var(--s3); color: #fff }
.step.next .dot { border-color: var(--accent); color: var(--ink) }
.step .st { font-weight: 600 } .step.later .st { color: var(--muted); font-weight: 400 }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.heat { display: grid; gap: 2px; align-items: center; font-size: 11px; color: var(--muted) }
.heat .c { height: 18px; border-radius: 3px; background: var(--soft) }
.heat .l { padding-right: 8px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.heat .h { text-align: center; font-size: 10px }
.title { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
.title h1 { font-size: 22px }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 0; width: min(880px, calc(100vw - 32px)); max-height: 86vh }
dialog::backdrop { background: rgba(0, 0, 0, .45) }
dialog .dh { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel) }
dialog pre { margin: 0; padding: 14px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere }
button.link { font: inherit; border: 0; background: none; padding: 0; color: var(--info); text-decoration: underline; text-underline-offset: 2px; cursor: pointer }
button.plain { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; border-radius: 6px; cursor: pointer }
.msg { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; overflow-wrap: anywhere; white-space: pre-wrap }
.msg .by { font-size: 12px; color: var(--muted); white-space: normal }
.rows { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow: auto }
.md-pre { max-height: 240px; overflow: auto; background: var(--soft); border-radius: 6px; padding: 8px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 }

.pbar { height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden } .pbar i { display: block; height: 100%; background: var(--s3); border-radius: 999px; min-width: 2px }
.pbar.alt i { background: var(--s4) }
.prog { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center }
.prog .big { font: 700 30px/1 var(--mono); font-variant-numeric: tabular-nums }
.prog .big.na { font-size: 16px; color: var(--muted); font-weight: 600 }
.prog .sub { grid-column: 1 / -1 }
.goal { font-size: 15px; line-height: 1.4; max-width: 90ch; white-space: pre-line }
.checks { list-style: none; padding: 0; display: grid; gap: 3px 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)) }
.checks li { display: flex; gap: 8px; align-items: baseline } .checks .t { font-family: var(--mono); width: 14px; flex: none; color: var(--muted) } .checks .y .t { color: var(--good) }
.nx { list-style: none; padding: 0 } .nx li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)) }
.kpis > div { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; display: flex; flex-direction: column; background: var(--bg) }
.kpis .v { font: 650 20px/1.2 var(--mono); font-variant-numeric: tabular-nums }
details.agent { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg) } details.agent > summary { color: var(--ink); font-size: 13px; font-weight: 600 }
details.agent .blk { display: flex; flex-direction: column; gap: 6px; margin-top: 10px }
.tagc { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin: 0 4px 3px 0; color: var(--muted) }
.note { border-left: 3px solid var(--line); padding: 2px 0 2px 10px } .note summary { color: var(--ink) }
#chat { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; z-index: 6; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-width: calc(100vw - 32px) }
#chat .fab { font: inherit; font-weight: 650; border: 0; background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.25) }
#chat .box { width: min(420px, calc(100vw - 32px)); height: min(580px, 80vh); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.3); display: flex; flex-direction: column; overflow: hidden }
#chat .ch { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line) }
#chat .cm { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px }
#chat .b { max-width: 88%; padding: 7px 10px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft) }
#chat .b.me { align-self: flex-end; background: var(--accent); color: #fff }
#chat .b.sys { align-self: center; background: none; color: var(--muted); font-size: 12px; text-align: center }
#chat .who { font-size: 11px; color: var(--muted); margin-bottom: 2px }
#chat .b.me .who { color: rgba(255,255,255,.8) }
#chat .used { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px }
#chat .used span { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; color: var(--muted); background: var(--panel) }
#chat form { border-top: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px }
#chat textarea { font: inherit; resize: none; width: 100%; height: 62px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); color: var(--ink) }
#chat .row { display: flex; justify-content: space-between; align-items: center; gap: 8px }
#chat .chips { display: flex; flex-wrap: wrap; gap: 5px }
#chat .chips button { font: inherit; font-size: 11px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 2px 8px; cursor: pointer }
#chat button.send { font: inherit; font-weight: 650; border: 0; background: var(--accent); color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer } #chat button:disabled { opacity: .5; cursor: default }
@media (max-width: 560px) { #chat .box { height: 78vh } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><nav class="crumbs" id="crumbs" aria-label="Where you are"></nav><p id="mission" class="small">Loading…</p></div>
    <span class="small muted"><span id="at"></span> · <a href="./">Open the desk to act</a></span>
  </header>
  <div id="view"></div>
</div>
<aside id="chat" aria-label="Chat"></aside>
<dialog id="dlg"><div class="dh"><strong id="dlgT"></strong><button class="plain" id="dlgX">Close</button></div><pre id="dlgB"></pre></dialog>
<div id="tip" hidden></div>

<script>
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const usd = (n, d = 2) => n == null || Number.isNaN(Number(n)) ? '–' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })
const when = t => t ? new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '–'
const ago = t => { if (!t) return 'never'; const m = Math.max(0, Math.round((Date.now() - new Date(t)) / 60000)); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago' }
const until = t => { const m = Math.round((new Date(t) - Date.now()) / 60000); return m <= 0 ? 'due now' : m < 60 ? 'in ' + m + ' min' : 'in ' + (m / 60).toFixed(1) + ' h' }
const pc = v => v == null ? '–' : Math.round(v * 100) + '%'
const mn = v => v == null ? '–' : v < 1 ? Math.max(1, Math.round(v * 60)) + ' s' : v < 90 ? Math.round(v) + ' min' : (v / 60).toFixed(1) + ' h'
let B = null, E = null, hours = 24, lastHTML = ''

async function api(path) {
  const r = await fetch('api/' + path, { headers: { 'x-company-request': '1' } })
  const j = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(j.error || ('request failed: ' + r.status))
  return j
}

async function post(path, body) {
  const r = await fetch('api/' + path, { method: 'POST', headers: { 'x-company-request': '1', 'content-type': 'application/json' }, body: JSON.stringify(body || {}) })
  const j = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(j.error || ('request failed: ' + r.status))
  return j
}

// ---------------- chart helpers (inline SVG; text colour comes from tokens, marks from the series tokens)
const W = el => Math.max(260, Math.floor(el.clientWidth || 600))
const nice = max => { if (max <= 0) return 1; const p = 10 ** Math.floor(Math.log10(max)); const f = max / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p }
const fmtN = v => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-US') : Number.isInteger(v) ? String(v) : v.toFixed(Math.abs(v) < 10 ? 2 : 1)
const table = (cols, rows) => rows.length ? `<div class="scroll"><table><tr>${cols.map((c, i) => `<th class="${i ? 'r' : ''}">${esc(c)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'r num' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>` : '<p class="empty">No data yet.</p>'

function bars(el, rows, { color = 'var(--s1)', fmt = fmtN, h = 150 } = {}) {
  if (!rows.length || rows.every(r => !r.value)) { el.innerHTML = '<p class="empty">Nothing recorded yet.</p>'; return }
  const w = W(el), L = 34, R = 8, T = 14, Bm = 20, pw = w - L - R, ph = h - T - Bm
  const max = nice(Math.max(...rows.map(r => r.value)))
  const bw = Math.min(28, Math.max(3, pw / rows.length - 2)), step = pw / rows.length
  const y = v => T + ph - ph * v / max
  const every = Math.ceil(rows.length / Math.max(2, Math.floor(pw / 46)))
  const top = rows.reduce((a, r) => (r.value > a.value ? r : a), rows[0])
  el.innerHTML = `<svg height="${h}" viewBox="0 0 ${w} ${h}" role="img">
    ${[0, 0.5, 1].map(f => `<line x1="${L}" x2="${w - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${y(max * f) + 4}" text-anchor="end">${esc(fmt(max * f))}</text>`).join('')}
    ${rows.map((r, i) => { const x = L + step * i + (step - bw) / 2, yy = y(r.value), bh = T + ph - yy, rad = Math.min(4, bw / 2, bh)
      return `${r.value > 0 ? `<path d="M${x} ${T + ph}V${yy + rad}q0 ${-rad} ${rad} ${-rad}h${bw - 2 * rad}q${rad} 0 ${rad} ${rad}V${T + ph}z" fill="${color}"/>` : ''}
        ${r === top && r.value > 0 ? `<text class="v" x="${x + bw / 2}" y="${yy - 4}" text-anchor="middle">${esc(fmt(r.value))}</text>` : ''}
        ${i % every === 0 ? `<text x="${x + bw / 2}" y="${h - 5}" text-anchor="middle">${esc(r.label)}</text>` : ''}
        <rect class="hit" x="${L + step * i}" y="${T}" width="${step}" height="${ph}" data-tip="${esc(r.tip || (r.label + ': ' + fmt(r.value)))}"/>` }).join('')}
    <line x1="${L}" x2="${w - R}" y1="${T + ph}" y2="${T + ph}" stroke="var(--line)" stroke-width="1"/></svg>`
}

function line(el, pts, { color = 'var(--s1)', fmt = fmtN, h = 170, step = false, zero = true, max: fixedMax } = {}) {
  if (pts.length < 2) { el.innerHTML = `<p class="empty">${pts.length ? `One reading so far (${esc(fmt(pts[0].v))}). ` : ''}The history is recorded every ten minutes from now on; the line fills in as the company runs.</p>`; return }
  const w = W(el), L = 44, R = 54, T = 12, Bm = 20, pw = w - L - R, ph = h - T - Bm
  const t0 = new Date(pts[0].t).getTime(), t1 = new Date(pts.at(-1).t).getTime()
  const vs = pts.map(p => p.v)
  let lo = zero ? Math.min(0, ...vs) : Math.min(...vs), hi = fixedMax ?? Math.max(...vs)
  if (hi === lo) { hi = lo + (Math.abs(lo) || 1) }
  if (!fixedMax) { const pad = (hi - lo) * 0.1; hi += pad; if (!zero || lo < 0) lo -= pad }
  const x = t => L + pw * (new Date(t).getTime() - t0) / Math.max(1, t1 - t0), y = v => T + ph - ph * (v - lo) / (hi - lo)
  let d = ''
  pts.forEach((p, i) => { const px = x(p.t), py = y(p.v); d += i === 0 ? `M${px} ${py}` : step ? `H${px}V${py}` : `L${px} ${py}` })
  const ticks = [lo, (lo + hi) / 2, hi]
  const span = t1 - t0, lab = t => new Date(t).toLocaleString([], span > 2 * 86400000 ? { month: 'short', day: 'numeric' } : { hour: '2-digit', minute: '2-digit' })
  const last = pts.at(-1)
  const cw = pw / pts.length
  el.innerHTML = `<svg height="${h}" viewBox="0 0 ${w} ${h}" role="img">
    ${ticks.map(v => `<line x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${esc(fmt(v))}</text>`).join('')}
    ${lo < 0 && hi > 0 ? `<line x1="${L}" x2="${w - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>` : ''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last.t)}" cy="${y(last.v)}" r="4" fill="${color}" stroke="var(--panel)" stroke-width="2"/>
    <text class="v" x="${x(last.t) + 8}" y="${y(last.v) + 4}">${esc(fmt(last.v))}</text>
    ${[pts[0].t, pts[Math.floor(pts.length / 2)].t, last.t].map((t, i) => `<text x="${x(t)}" y="${h - 5}" text-anchor="${i === 0 ? 'start' : i === 2 ? 'end' : 'middle'}">${esc(lab(t))}</text>`).join('')}
    ${pts.map(p => `<rect class="hit" x="${x(p.t) - cw / 2}" y="${T}" width="${Math.max(2, cw)}" height="${ph}" data-tip="${esc(when(p.t) + '\n' + fmt(p.v))}"/>`).join('')}</svg>`
}

function hbars(el, rows, { color = 'var(--s1)', fmt = fmtN } = {}) {
  if (!rows.length || rows.every(r => !r.value)) { el.innerHTML = '<p class="empty">Nothing recorded yet.</p>'; return }
  const w = W(el), L = Math.min(170, Math.max(90, w * 0.34)), R = 56, rh = 24, h = rows.length * rh + 6, pw = w - L - R
  const max = Math.max(...rows.map(r => r.value)) || 1
  el.innerHTML = `<svg height="${h}" viewBox="0 0 ${w} ${h}" role="img">${rows.map((r, i) => { const bw = Math.max(r.value > 0 ? 2 : 0, pw * r.value / max), yy = 4 + i * rh, rad = Math.min(4, bw)
    return `<text x="${L - 8}" y="${yy + 13}" text-anchor="end">${esc(r.label.length > 24 ? r.label.slice(0, 23) + '…' : r.label)}</text>
      ${bw > 0 ? `<path d="M${L} ${yy}h${bw - rad}q${rad} 0 ${rad} ${rad}v${16 - 2 * rad}q0 ${rad} ${-rad} ${rad}H${L}z" fill="${r.color || color}"/>` : ''}
      <text class="v" x="${L + bw + 6}" y="${yy + 13}">${esc(fmt(r.value))}</text>
      <rect class="hit" x="0" y="${yy - 3}" width="${w}" height="${rh}" data-tip="${esc(r.tip || (r.label + ': ' + fmt(r.value)))}"/>` }).join('')}
    <line x1="${L}" x2="${L}" y1="0" y2="${h}" stroke="var(--line)" stroke-width="1"/></svg>`
}

function gantt(el, A) {
  const rows = A.rows, w = W(el), L = Math.min(170, Math.max(96, w * 0.26)), R = 64, T = 18, rh = 26, h = T + rows.length * rh + 8, pw = w - L - R
  const t0 = new Date(A.from).getTime(), t1 = new Date(A.to).getTime(), x = t => L + pw * (t - t0) / (t1 - t0)
  const n = Math.max(2, Math.min(8, Math.floor(pw / 90))), spanH = (t1 - t0) / 3600000
  const lab = t => new Date(t).toLocaleString([], spanH > 48 ? { month: 'short', day: 'numeric' } : { hour: '2-digit', minute: '2-digit' })
  el.innerHTML = `<svg height="${h}" viewBox="0 0 ${w} ${h}" role="img">
    ${Array.from({ length: n + 1 }, (_, i) => { const t = t0 + (t1 - t0) * i / n; return `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${h - 6}" stroke="var(--grid)" stroke-width="1"/><text x="${x(t)}" y="11" text-anchor="${i === 0 ? 'start' : i === n ? 'end' : 'middle'}">${i === n ? 'now' : esc(lab(t))}</text>` }).join('')}
    ${rows.map((r, i) => { const yy = T + i * rh + 5
      return `<text x="${L - 8}" y="${yy + 12}" text-anchor="end">${esc(r.name.length > 24 ? r.name.slice(0, 23) + '…' : r.name)}</text>
        <rect x="${L}" y="${yy + 7}" width="${pw}" height="2" fill="var(--soft)"/>
        ${r.spans.map(s => { const sx = x(s.s), sw = Math.max(3, x(s.e) - sx); return `<rect x="${sx}" y="${yy}" width="${sw}" height="16" rx="${Math.min(4, sw / 2)}" fill="var(--s1)" stroke="var(--panel)" stroke-width="1"/><rect class="hit" x="${sx - 2}" y="${yy - 4}" width="${sw + 4}" height="24" data-tip="${esc(r.name + '\n' + when(s.s) + ' to ' + when(s.e) + ' (' + Math.max(1, Math.round((s.e - s.s) / 60000)) + ' min)\n' + s.labels.join(', '))}"/>` }).join('')}
        <text class="v" x="${w - R + 8}" y="${yy + 12}">${r.busyMin ? r.busyMin + ' min' : '–'}</text>` }).join('')}</svg>`
}

function treeHTML(keys, depth, stopTypes = []) {
  const kids = k => B.tree.filter(n => n.parent === k)
  const open = (n, d) => d > 0 && !stopTypes.includes(n.type) ? kids(n.key) : []
  const li = (n, d) => { const ch = open(n, d), leaf = ch.length > 1 && ch.every(c => !open(c, d - 1).length)
    return `<li>${nodeCard(n)}${ch.length ? `<ul${leaf ? ' class="leaf"' : ''}>${ch.map(c => li(c, d - 1)).join('')}</ul>` : ''}</li>` }
  return keys.map(k => li(B.tree.find(n => n.key === k), depth)).join('')
}
/** A wide org chart hides children behind a sideways scroll. When it does not fit, stack each group of end boxes in a

function fitTrees() {
  for (const w of document.querySelectorAll('.treewrap')) {
    const t = w.querySelector('.tree'), fits = () => t.scrollWidth <= w.clientWidth + 1
    t.classList.remove('compact'); w.classList.remove('overflow')
    if (!fits()) t.classList.add('compact')
    if (!fits()) w.classList.add('overflow')
  }
}

const rangeButtons = () => `<span class="seg" role="group" aria-label="Time range">${[[6, '6 h'], [24, '24 h'], [72, '3 d'], [168, '7 d']].map(([v, l]) => `<button data-h="${v}" aria-pressed="${hours === v}">${l}</button>`).join('')}</span>`
const SLx = () => (B.profile && B.profile.stageLabels) || {}, GATED = () => B.profile ? B.profile.gatedStage : 'paper'
function overviewCharts() {
  const g = B.goal, top = B.tree.filter(n => ['Super agent', 'COO', 'Assurance', 'Department', 'Builders'].includes(n.type))
  heat($('heat'), top)
  hbars($('cLoad'), top.slice().sort((a, b) => b.min24 - a.min24).map(u => ({ label: u.name, value: u.min24, tip: `${u.name}\n${u.min24} agent-minutes in 24 h · ${u.turnsToday} turns today` })), { fmt: v => v + ' min' })

  const D = B.days, dl = d => d.date.slice(5)

  bars2($('cTickets'), D.map(d => ({ label: dl(d), a: d.ticketsOpened, b: d.ticketsDelivered, tip: `${d.date}\n${d.ticketsOpened} opened · ${d.ticketsDelivered} delivered` })), ['Opened', 'Delivered'], { h: 130 })
  bars($('cTurns'), D.map(d => ({ label: dl(d), value: d.workerTurns })), { h: 130 })

  bars2($('cIdeas'), D.map(d => ({ label: dl(d), a: d.ideasNew, b: d.ideasKilled, tip: `${d.date}\n${d.ideasNew} opened · ${d.ideasKilled} killed` })), ['Opened', 'Killed'], { h: 130 })

  const o = B.ops
  $('ops').innerHTML = [
    ['Tickets delivered', `${o.ticketsDelivered} of ${o.ticketsEnded}`, `${pc(o.deliveredRate)} of finished tickets · ${o.ticketsOpen} open`],
    ['Time to deliver a ticket', mn(o.medianTicketMin), 'median, open to delivered'],
    ['Worker turns per ticket', o.avgTurns ?? '–', 'average for delivered tickets'],
    ['Wait before a decision', mn(o.decisionWaitMedianMin), 'median, event to super agent'],
    ['Engine up, last 24 h', pc(o.engineUptime24h), o.engineUptime24h == null ? 'measured from now on' : 'share of ten-minute checks'],
    ['Company cycle', mn(o.cycleAvgMin), `average · ${usd(o.cycleAvgUsd)} each`],

  hbars($('cFunnel'), B.funnel.map(f => ({ label: SLx()[f.stage] || f.stage, value: f.n, color: f.stage === 'killed' ? 'var(--muted)' : f.stage === GATED() ? 'var(--s3)' : 'var(--s1)' })))
  const tot = B.costByUnit.reduce((a, u) => a + u.usd, 0) || 1

}

// ---------------- one unit, team or individual

  const self = B.tree.find(n => n.ref === e.ref)
  const hasKids = self && B.tree.some(n => n.parent === self.key)
  const tiles = [
    ['Turns today', k.turnsToday, `${k.toolsToday} tool calls`],
    ['Worked in 24 h', mn(k.min24), 'agent-minutes'],
    ['Share of model usage', pc(k.share), 'of everything recorded'],
    ['Turns that completed', pc(k.successRate), `${k.turns} recorded turns`],
    ['Last active', ago(k.lastActive), k.lastActive ? when(k.lastActive) : ''],
  ]
  if (k.people > 1) tiles.push(['People', k.people, 'agents in this unit'])
  if (k.openInitiatives != null) tiles.push(['Open initiatives', k.openInitiatives, `${k.killed} killed`])
  if (k.decisions != null) tiles.push(['Decisions', k.decisions, `${k.pending} event(s) waiting`])
  const Lx = E.leader
  if (Lx) {
    tiles.push(['Threads running', Lx.threads.length, Lx.threads.join(', ') || (Lx.pending ? `${Lx.pending} event(s) waiting` : 'idle')])
    tiles.push(['Plan', `${Lx.plan.doing} doing`, `${Lx.plan.ready} ready · ${Lx.plan.blocked} blocked · ${Lx.plan.done} done`])
    tiles.push(['Busy, last 24 h', Lx.busy24 + '%', 'a turn, ticket or ask of its own running'])
  }
  const p = d.plan
  return `
  <section class="panel">
    <div class="title"><h1>${esc(e.name)}</h1><span class="pill">${esc(e.type)}</span><span class="pill ${s[0]}">${s[1]}</span>${e.sub ? `<span class="small muted">${esc(e.sub)}</span>` : ''}${d.reportsTo ? `<span class="small muted">reports to ${esc(d.reportsTo)}</span>` : ''}</div>
    ${e.what ? `<p>${esc(e.what)}</p>` : ''}${e.description ? `<p class="muted">${esc(e.description)}</p>` : ''}
    ${e.doing.length ? `<p><strong>Doing now:</strong> ${esc(e.doing.join(' · '))}</p>` : self && self.work ? `<p><strong>Current work:</strong> ${esc(self.work)}</p>` : ''}
    <div class="facts">${tiles.map(([a, v, c]) => `<div><span class="small muted">${esc(a)}</span><span class="v">${esc(v)}</span><span class="small muted">${esc(c)}</span></div>`).join('')}</div>
  </section>

  ${outlookPanel(e)}
  ${kpiPanel(e)}

  ${hasKids ? `<section class="panel"><div class="head"><h2>Inside ${esc(e.name)}</h2></div>${treeLegend}<div class="treewrap"><div class="tree"><ul>${treeHTML([self.key], 2)}</ul></div></div></section>` : ''}

  <div class="grid3">
    <section class="panel"><div class="head"><h3>Activity by hour</h3><span class="small muted">agent-minutes, last 24 h</span></div><div class="chart" id="eHour"></div></section>
    <section class="panel"><div class="head"><h3>Turns per day</h3><span class="small muted">last 14 days</span></div><div class="chart" id="eTurns"></div></section>
    <section class="panel"><div class="head"><h3>Time worked per day</h3><span class="small muted">agent-minutes</span></div><div class="chart" id="eMin"></div></section>
  </div>

  ${e.members.length > 1 ? `<div class="grid2">
    <section class="panel"><div class="head"><h3>Who did the work, last 24 hours</h3><span class="small muted">agent-minutes</span></div><div class="chart" id="eMemMin"></div></section>
    <section class="panel"><div class="head"><h3>Turns today, by member</h3></div><div class="chart" id="eMemTurns"></div></section>
  </div>` : ''}

  <section class="panel"><div class="head"><h2>${e.members.length > 1 ? 'When each member worked' : 'When it worked'}</h2>${rangeButtons()}</div><div class="chart" id="eGantt"></div></section>

  ${e.funnel ? `<div class="grid2"><section class="panel"><div class="head"><h3>Its ideas by stage</h3></div><div class="chart" id="eFunnel"></div></section>
    <section class="panel"><div class="head"><h3>Its initiatives</h3></div>${(d.initiatives || []).length ? `<ul>${d.initiatives.map(i => `<li><span class="pill">${esc(SLx()[i.stage] || i.stage)}</span> <strong>${esc(i.title)}</strong>${i.confidence != null ? ` <span class="small muted num">confidence ${Math.round(i.confidence * 100)}%</span>` : ''}${i.note ? `<br><span class="small muted">${esc(i.note)}</span>` : ''}</li>`).join('')}</ul>` : '<p class="empty">None yet.</p>'}</section></div>` : ''}

  ${E.capability ? capabilityPanel(E.capability) : ''}

  ${e.decisionsDaily ? `<div class="grid2"><section class="panel"><div class="head"><h3>Decisions per day</h3></div><div class="chart" id="eDec"></div></section>
    <section class="panel"><div class="head"><h3>Its tickets</h3></div><div class="chart" id="eTk"></div></section></div>
    <div class="grid2"><section class="panel"><div class="head"><h3>Plan</h3>${p ? `<span class="small muted">updated ${ago(p.updatedAt)}</span>` : ''}</div>${p ? `<p><strong>Focus.</strong> ${esc(p.focus)}</p><ol>${p.priorities.map(x => `<li><strong>${esc(x.text)}</strong> <span class="small muted">${esc(x.why)}</span></li>`).join('')}</ol><ul>${p.todo.map(t => `<li><span class="pill ${t.status === 'doing' ? 'info' : t.status === 'blocked' ? 'bad' : t.status === 'done' ? 'good' : ''}">${esc(t.status)}</span> ${esc(t.text)} <span class="small muted">${esc(t.owner)}${t.workstream ? ' · ' + esc(t.workstream) : ''}${t.dependsOn && t.dependsOn.length ? ' · after ' + t.dependsOn.map(id => esc((p.todo.find(x => x.id === id) || { text: id }).text.slice(0, 40))).join(', ') : ''}${t.ticket && !t.ref ? ' · opens its ticket when ready' : ''}${t.note ? ' · ' + esc(t.note) : ''}</span></li>`).join('')}</ul>` : '<p class="empty">No plan written yet.</p>'}</section>
    <section class="panel"><div class="head"><h3>Last decisions and why</h3></div><div class="rows">${(d.decisions || []).map(x => `<div class="msg"><div class="by">${when(x.at)}</div>${esc(x.note)}</div>`).join('') || '<p class="empty">None yet.</p>'}</div></section></div>` : ''}

  ${e.ref === 'workers' || (d.tickets && !e.decisionsDaily) ? `<section class="panel"><div class="head"><h3>Tickets</h3></div>${(d.tickets || []).length ? table(['Ticket', 'State', 'Turns'], d.tickets.map(t => [t.title, t.outcome || t.status, t.turns])) : '<p class="empty">None.</p>'}</section>` : ''}

  <div class="grid2">

    <section class="panel"><div class="head"><h3>History</h3></div><div class="rows">${(e.timeline || []).map(x => `<div class="msg"><div class="by">${when(x.ts)} · <strong>${esc(x.kind)}</strong></div>${esc(x.text)}</div>`).join('') || '<p class="empty">Nothing recorded for it yet.</p>'}</div></section>
  </div>

  ${madePanel(e)}`
}
function entityCharts() {
  const e = E, now = new Date(), hr = i => String(new Date(now.getTime() - (23 - i) * 3600000).getHours()).padStart(2, '0')

  bars($('eMin'), e.days.map(d => ({ label: d.date.slice(5), value: d.minutes, tip: `${d.date}\n${d.minutes} agent-minutes` })), { h: 140, color: 'var(--s3)' })

// ---------------- goal, progress, timeline, next steps, outcome, KPIs
function outlookPanel(e) {
  const o = e.outlook; if (!o) return ''
  const p = o.progress, sec = p.secondary
  const parts = (p.parts || []).length ? ((p.parts[0].done !== undefined)
    ? `<details><summary>${p.parts.filter(x => x.done).length} of ${p.parts.length} done: show every step</summary><ul class="checks" style="margin-top:8px">${p.parts.map(x => `<li class="${x.done ? 'y' : ''}"><span class="t">${x.done ? '✓' : '○'}</span><span>${esc(x.label)}${x.detail ? `<br><span class="small muted">${esc(x.detail)}</span>` : ''}</span></li>`).join('')}</ul></details>`
    : `<p class="small">${p.parts.map(x => `<span class="tagc">${esc(x.label)} <strong class="num">${x.n}</strong></span>`).join('')}</p>`) : ''
  const eta = o.eta
  return `
  <section class="panel">
    <div class="head"><h2>Goal and progress</h2><span class="small muted">every figure says how it was measured</span></div>
    <p class="goal">${esc(o.goal.text || 'No goal written for this unit.')}</p>
    <div class="prog">
      <div class="big num ${p.pct == null ? 'na' : ''}">${p.pct == null ? 'Not measurable' : p.pct + '%'}</div>
      <div><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.pct ?? 0}"><i style="width:${Math.max(0, Math.min(100, p.pct ?? 0))}%"></i></div><div class="small" style="margin-top:3px"><strong>${esc(p.label)}</strong></div></div>
      <div class="sub small muted">${esc(p.basis)}</div>
    </div>
    ${sec ? `<div class="prog"><div class="big num" style="font-size:20px">${sec.pct}%</div><div><div class="pbar alt"><i style="width:${Math.max(0, Math.min(100, sec.pct))}%"></i></div><div class="small" style="margin-top:3px"><strong>${esc(sec.label)}</strong></div></div><div class="sub small muted">${esc(sec.basis)}</div></div>` : ''}
    ${o.note ? `<p class="small muted">${esc(o.note)}</p>` : ''}
    ${parts}
    <div class="grid3">
      <div><h3>Estimated timeline</h3><p>${esc(eta.text)}${eta.date ? `<br><span class="num">${when(eta.date)}</span>` : ''}</p>${eta.basis ? `<p class="small muted">${esc(eta.basis)}</p>` : ''}</div>
      <div><h3>Expected outcome</h3><p style="white-space:pre-line">${esc(o.outcome.text)}</p>${o.outcome.basis ? `<p class="small muted">${esc(o.outcome.basis)}</p>` : ''}</div>
      <div><h3>What to do next</h3>${o.next.length ? `<ul class="nx">${o.next.map(x => `<li><span class="pill ${/^(working|doing|next)/.test(x.status) ? 'info' : /blocked|blocker/.test(x.status) ? 'bad' : ''}">${esc(x.status)}</span><span>${esc(x.text)}${x.note ? `<br><span class="small muted">${esc(x.note)}</span>` : ''}</span></li>`).join('')}</ul>` : '<p class="empty">Nothing queued.</p>'}</div>
    </div>
    ${o.schedules.length ? `<div><h3>Scheduled by you</h3><ul class="nx">${o.schedules.map(x => `<li><span class="num">${when(x.at)}${x.everyHours ? ' · every ' + x.everyHours + ' h' : ''}</span><span>${esc(x.text)}</span><button class="link" data-cancel="${esc(x.id)}">cancel</button></li>`).join('')}</ul></div>` : ''}
  </section>`
}
function kpiPanel(e) {
  const o = e.outlook; if (!o || !o.kpis.length) return ''
  return `<section class="panel"><div class="head"><h2>KPIs</h2><span class="small muted">from recorded runs, last 14 days unless stated</span></div><div class="kpis">${o.kpis.map(k => `<div><span class="small muted">${esc(k.label)}</span><span class="v">${esc(k.value)}</span><span class="small muted">${esc(k.sub || '')}</span></div>`).join('')}</div></section>`
}
function madePanel(e) {
  const m = e.made; if (!m || !m.setup.length) return ''
  const mem = Object.fromEntries(m.memory.map(x => [x.agent, x]))
  const one = m.setup.length === 1
  const blocks = m.setup.map(a => {
    const x = mem[a.name] || { notes: [], journal: [], noteCount: 0, mode: 'none' }
    return `<details class="agent" ${one ? 'open' : ''}>
      <summary>${esc(a.name)} <span class="small muted">· ${esc(a.provider)}/${esc(a.model)} · ${a.skills.length} skills · ${x.mode === 'none' ? 'no memory' : x.noteCount + ' notes'} · ${a.canWrite ? 'can write and run code' : 'read-only'}</span></summary>
      <div class="blk">
        ${a.description ? `<p class="small muted">${esc(a.description)}</p>` : ''}
        <h3>Instructions</h3><pre class="md-pre">${esc(a.role)}</pre>
        <h3>Skills</h3>${a.skills.length ? `<ul>${a.skills.map(k => `<li><strong>${esc(k.name)}</strong>${k.description ? ` <span class="small muted">${esc(k.description)}</span>` : ''}</li>`).join('')}</ul>` : '<p class="empty">None. Ask it in the chat to install or add skills.</p>'}
        <h3>Tools</h3><p class="small">Allowed: ${esc(a.tools.join(', ') || 'none')}${a.disallowedTools.length ? `<br>Blocked: ${esc(a.disallowedTools.join(', '))}` : ''}${a.mcp.length ? `<br>Extra tool servers: ${esc(a.mcp.join(', '))}` : ''}</p>
        <h3>Settings</h3><p class="small muted">Effort ${esc(a.effort || 'default')} · up to ${esc(a.maxTurns ?? '?')} turns per task · permission ${esc(a.permission || 'default')}${a.project ? ' · project ' + esc(a.project) : ''}${a.folders.length ? '<br>Folders: ' + esc(a.folders.join(', ')) : ''}${a.tags.length ? '<br>' + a.tags.map(t => `<span class="tagc">${esc(t)}</span>`).join('') : ''}</p>
        <h3>Memory <span class="small muted">${x.mode === 'none' ? 'off for this agent' : esc(x.mode) + ' · ' + esc(x.scope || '')}</span></h3>
        ${x.notes.length ? x.notes.map(n => `<details class="note"><summary>${esc(n.title)} <span class="small muted">${n.updated ? when(n.updated) : ''}</span></summary>${(n.tags || []).map(t => `<span class="tagc">${esc(t)}</span>`).join('')}<pre class="md-pre">${esc(n.body)}</pre></details>`).join('') : `<p class="empty">${x.mode === 'none' ? 'It keeps no notes. Tell it to remember something in the chat and memory is switched on for it.' : 'No notes yet.'}</p>`}
        ${x.journal.length ? `<details><summary>What it did recently (${x.journalCount} entries)</summary><div class="rows" style="margin-top:6px">${x.journal.map(j => `<div class="msg"><div class="by">${when(j.ts)} · ${esc(j.label || '')} · ${j.ok ? 'done' : 'failed'}</div>${esc(j.outcome)}</div>`).join('')}</div></details>` : ''}
      </div></details>`
  }).join('')
  return `<section class="panel"><div class="head"><h2>${one ? 'Its setup and memory' : 'Setup and memory of its agents'}</h2><span class="small muted">instructions, skills, tools, settings, notes</span></div>${blocks}</section>`
}

// ---------------- chat: runs beside their work, never queues behind it
const CH = { ref: null, data: null, open: false, busy: false, drafts: {}, timer: null, err: '' }
try { CH.open = localStorage.getItem('deskChatOpen') === '1' } catch {}
const chatRefNow = () => route()
function chatChips() {
  return ['What are you working on and how far along are you?', 'What will you do next, and when?', 'Remember: ', 'Schedule: ', 'Which skills do you have? Which would help?'].map(t => `<button type="button" data-chip="${esc(t)}">${esc(t.length > 30 ? t.slice(0, 28) + '…' : t)}</button>`).join('')
}
function chatShell() {
  const d = CH.data, host = $('chat')
  if (!CH.open) { host.innerHTML = `<button class="fab" id="cOpen">Chat${d ? ' with ' + esc(d.title) : ''}${d && d.busy ? ' …' : ''}</button>`; $('cOpen').onclick = () => { CH.open = true; try { localStorage.setItem('deskChatOpen', '1') } catch {}; chatShell(); chatLoad(true) }; return }
  host.innerHTML = `<div class="box">
    <div class="ch"><div><strong id="cT"></strong><div class="small muted" id="cS"></div></div><div><button class="plain" id="cClr" title="Delete this conversation (memory notes stay)">Clear</button> <button class="plain" id="cX" aria-label="Close chat">Close</button></div></div>
    <div class="cm" id="cM" aria-live="polite"></div>
    <form id="cF"><div class="chips" id="cC">${chatChips()}</div><textarea id="cIn" placeholder="Ask a question, give a task, schedule, memorise, or change skills. Enter sends, Shift+Enter adds a line." maxlength="6000"></textarea>
      <div class="row"><span class="small muted">Runs beside their work. It does not interrupt it.</span><span><button type="button" class="plain" id="cStop" hidden>Stop</button> <button class="send" id="cSend">Send</button></span></div></form></div>`
  $('cX').onclick = () => { CH.open = false; try { localStorage.setItem('deskChatOpen', '0') } catch {}; chatShell() }
  $('cClr').onclick = async () => { if (!CH.data || !confirm('Delete this conversation?')) return; try { await post('super/chat/clear', { ref: CH.ref }); CH.data.messages = []; chatPaint(true) } catch (e) { alertText(e.message) } }
  $('cStop').onclick = async () => { try { await post('super/chat/stop', { ref: CH.ref }); chatLoad(true) } catch (e) { alertText(e.message) } }
  const ta = $('cIn'); ta.value = CH.drafts[CH.ref] || ''
  ta.oninput = () => { CH.drafts[CH.ref] = ta.value }
  ta.onkeydown = ev => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); chatSend() } }
  $('cF').onsubmit = ev => { ev.preventDefault(); chatSend() }
  $('cC').onclick = ev => { const b = ev.target.closest('[data-chip]'); if (!b) return; ta.value = b.dataset.chip; ta.oninput(); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length) }
  chatPaint(true)
}
function chatPaint(stick) {
  const d = CH.data; if (!CH.open || !$('cM')) return
  $('cT').textContent = d ? 'Chat with ' + d.title : 'Chat'
  $('cS').textContent = d ? `${d.type} · answers as ${d.voice}` : (CH.err || 'Loading…')
  const m = $('cM'), atEnd = stick || m.scrollHeight - m.scrollTop - m.clientHeight < 40
  const rows = (d ? d.messages : []).map(x => x.from === 'owner'
    ? `<div class="b me"><div class="who">You${x.status === 'queued' ? ' · waiting' : ''}</div>${esc(x.text)}</div>`
    : x.from === 'system' ? `<div class="b sys">${esc(x.text)}</div>`
    : `<div class="b"><div class="who">${esc(x.agent || 'Agent')} · ${when(x.ts)}</div>${esc(x.text)}${(x.tools || []).length ? `<div class="used">${x.tools.map(t => `<span title="${esc(t.arg || '')}">${esc(t.tool)}</span>`).join('')}</div>` : ''}</div>`)
  if (d && d.busy) rows.push(`<div class="b sys">${esc(d.voice)} is replying. Its normal work carries on meanwhile.</div>`)
  if (!rows.length) rows.push('<div class="b sys">Ask how it is doing, how far along it is, or tell it what to do. Say "remember …" to store a note, "schedule …" to plan something, or ask it to install or change skills.</div>')
  m.innerHTML = rows.join('')
  if (atEnd) m.scrollTop = m.scrollHeight
  $('cStop').hidden = !(d && d.busy)
  $('cSend').disabled = CH.busy
}
async function chatSend() {
  const ta = $('cIn'); if (!ta || CH.busy) return
  const text = ta.value.trim(); if (!text) return
  CH.busy = true; $('cSend').disabled = true
  try {
    await post('super/chat', { ref: CH.ref, text })
    ta.value = ''; CH.drafts[CH.ref] = ''
    await chatLoad(true)
  } catch (e) { alertText(e.message) }
  CH.busy = false; if ($('cSend')) $('cSend').disabled = false
}
async function chatLoad(stick) {
  const r = chatRefNow()
  try {
    const d = await api('super/chat?ref=' + encodeURIComponent(r))
    if (chatRefNow() !== r) return
    const changed = CH.ref !== r
    CH.data = d; CH.ref = r; CH.err = ''
    if (changed || !$('cM')) chatShell(); else chatPaint(stick)
  } catch (e) { CH.err = e.message; CH.data = null; CH.ref = r; if (CH.open) { if (!$('cM')) chatShell(); chatPaint(false) } else chatShell() }
}
function chatLoop() {
  clearTimeout(CH.timer)
  chatLoad(false).finally(() => { CH.timer = setTimeout(chatLoop, CH.data && (CH.data.busy || CH.data.queued) ? 1500 : 7000) })
}

// ---------------- routing and loading
const route = () => decodeURIComponent(location.hash.slice(1)) || 'company'
function crumbs() {
  const list = route() === 'company' || !E ? [{ ref: 'company', name: 'Company dashboard' }] : E.crumbs.map((c, i) => (i === 0 ? { ref: 'company', name: 'Company dashboard' } : c))
  $('crumbs').innerHTML = list.map((c, i) => i === list.length - 1 ? `<span class="cur">${esc(c.name)}</span>` : `<button data-go="${esc(c.ref)}">${esc(c.name)}</button><span class="muted">›</span>`).join(' ')
}
function render() {
  const r = route(), isOverview = r === 'company'
  if (!B || (!isOverview && (!E || E.ref !== r))) return
  $('mission').textContent = B.goal.mission
  $('at').textContent = 'updated ' + when(B.at)
  crumbs()
  const html = isOverview ? overview() : entityView()
  const key = JSON.stringify([r, hours, isOverview ? [B.tree, B.goal, B.money, B.health, B.next, B.days, B.history.length, B.ops, B.activity.rows] : { ...E, at: 0 }]) + '|' + $('view').clientWidth
  if (key === lastHTML) return
  lastHTML = key
  const y = window.scrollY
  $('view').innerHTML = html
  fitTrees()
  isOverview ? overviewCharts() : entityCharts()
  window.scrollTo(0, y)
}
async function load() {
  try {
    const r = route()
    const [b, e] = await Promise.all([api('super/board?hours=' + hours), r === 'company' ? null : api(`super/entity?ref=${encodeURIComponent(r)}&hours=${hours}`)])
    B = b; E = e; render()
  } catch (err) { $('mission').textContent = 'Cannot load: ' + err.message + '. If the portal was restarted, reload this page.' }
}
window.addEventListener('hashchange', () => { chatLoad(true); E = null; lastHTML = ''; window.scrollTo(0, 0); $('view').innerHTML = '<p class="empty">Loading…</p>'; load() })
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-go],[data-h],[data-run]'); if (!t) return
  const d = t.dataset
  if (d.go) { location.hash = d.go === 'company' ? '' : encodeURIComponent(d.go); return }
  if (d.h) { hours = Number(d.h); lastHTML = ''; return load() }
  if (d.run) { try { const f = await api(`runs/${d.run}/file?path=${encodeURIComponent(d.file)}`); $('dlgT').textContent = d.file; $('dlgB').textContent = f.text; $('dlg').showModal() } catch (e) { alertText(e.message) } }
})
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-cancel]'); if (!t) return
  try { await post('super/schedules/cancel', { id: t.dataset.cancel }); t.textContent = 'cancelling…'; setTimeout(() => { lastHTML = ''; load() }, 1800) } catch (e) { alertText(e.message) }
})
function alertText(m) { $('dlgT').textContent = 'Could not open'; $('dlgB').textContent = m; $('dlg').showModal() }
$('dlgX').onclick = () => $('dlg').close()
const tip = $('tip')
document.addEventListener('mousemove', e => {
  const t = e.target.closest ? e.target.closest('[data-tip]') : null
  if (!t) { tip.hidden = true; return }
  tip.textContent = t.dataset.tip; tip.hidden = false
  const r = tip.getBoundingClientRect()
  tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, e.clientX + 14)) + 'px'
  tip.style.top = Math.max(8, Math.min(window.innerHeight - r.height - 8, e.clientY + 14)) + 'px'
})
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150) })
load(); setInterval(load, 15000); chatShell(); chatLoop()
</script>
</body>
</html>
