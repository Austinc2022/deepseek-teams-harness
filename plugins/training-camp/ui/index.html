<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training camp</title>
<style>
/* One camp at a time. Top: which camp, and one card that says where it stands and what to press.
   Below: five tabs (Overview, Agents, Workflow, Results, Settings), so nothing is a mile-long scroll. */
:root {
  --bg: #f4f5f8; --panel: #ffffff; --ink: #161a23; --muted: #5c6475; --line: #dfe3ea; --soft: #eef0f5;
  --accent: #4f46e5; --accent-soft: #e8e7fd; --accent-ink: #ffffff;
  --good: #15803d; --good-soft: #dcf3e3; --warn: #b45309; --warn-soft: #fbecd3; --bad: #b91c1c; --bad-soft: #fbe1e1; --info: #1d5fa8; --info-soft: #dbe9f8;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 4px 14px rgba(20, 24, 40, .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1218; --panel: #171b24; --ink: #e8ebf2; --muted: #98a1b3; --line: #2a3040; --soft: #1f2430;
  --accent: #8b84ff; --accent-soft: #272a52; --accent-ink: #0d0f1a;
  --good: #4ade80; --good-soft: #14321f; --warn: #f5b04c; --warn-soft: #3a2a10; --bad: #f87171; --bad-soft: #3b1717; --info: #7db8f5; --info-soft: #152a41;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark } }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); padding: 0 16px 60px }
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
h1 { font-size: 24px; line-height: 1.2; margin: 0; letter-spacing: -.02em; overflow-wrap: anywhere }
h2 { font-size: 17px; margin: 0; letter-spacing: -.01em }
h3 { font-size: 15px; margin: 0 }
p { margin: 0 }
.muted { color: var(--muted) } .small { font-size: 13px } .num { font-variant-numeric: tabular-nums }
.mono { font-family: var(--mono); font-size: 12.5px }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500 }
button:hover:not(:disabled) { border-color: var(--muted) }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; padding: 10px 20px; font-size: 16px }
button.danger { color: var(--bad); border-color: var(--bad) }
button.ghost { border-color: transparent; background: none; color: var(--accent); padding: 4px 6px }
button:disabled { opacity: .5; cursor: default }
input, textarea, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100% }
textarea { resize: vertical; min-height: 76px }
textarea.code { font: 12.5px/1.5 var(--mono); min-height: 280px; white-space: pre }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); flex: 1 1 180px; min-width: 0 }
label.f > b { color: var(--ink); font-weight: 600 }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow) }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.between { justify-content: space-between }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)) }

/* top bar */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 0 0 }
.bar .brand { font-weight: 700; font-size: 16px; margin-right: 6px }
.bar select { width: auto; max-width: min(100%, 420px); font-weight: 600 }

/* status chips */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--soft); color: var(--muted); white-space: nowrap }
.chip.good { background: var(--good-soft); color: var(--good) } .chip.warn { background: var(--warn-soft); color: var(--warn) }
.chip.bad { background: var(--bad-soft); color: var(--bad) } .chip.info { background: var(--info-soft); color: var(--info) }
.chip.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite }
@keyframes pulse { 50% { opacity: .25 } }
@media (prefers-reduced-motion: reduce) { .chip.live::before, .dot.now { animation: none } }
.tag { font-size: 12.5px; padding: 1px 8px; border-radius: 6px; background: var(--soft); white-space: nowrap }

/* hero */
.hero { border-left: 5px solid var(--accent) }
.hero.good { border-left-color: var(--good) } .hero.warn { border-left-color: var(--warn) } .hero.bad { border-left-color: var(--bad) }
.hero .say { font-size: 18px; font-weight: 600; line-height: 1.35 }
.meter { height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; min-width: 4px; transition: width .4s }
.meter.good > i { background: var(--good) }
.note { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 14px }
.note.err { background: var(--bad-soft) } .note.ok { background: var(--good-soft) }

/* tabs */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line) }
.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--muted); font-weight: 600 }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent) }

/* stage tracker */
.track { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px }
.stage { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; background: var(--panel); text-align: left; font-weight: 400 }
.stage[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) }
.stage .top { display: flex; align-items: center; gap: 8px; font-weight: 650 }
.dot { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--soft); color: var(--muted); flex: none }
.dot.done { background: var(--good); color: #fff } .dot.now { background: var(--accent); color: var(--accent-ink); animation: pulse 1.6s ease-in-out infinite } .dot.part { background: var(--info-soft); color: var(--info) } .dot.hold { background: var(--warn-soft); color: var(--warn) }

/* agents */
.agent { cursor: pointer; text-align: left; font-weight: 400; gap: 10px; padding: 14px }
.agent:hover { border-color: var(--accent) }
.phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.ph { border-radius: 8px; padding: 6px 8px; background: var(--soft); font-size: 12.5px; display: flex; flex-direction: column; gap: 1px; min-width: 0 }
.ph b { font-size: 12px; color: var(--muted); font-weight: 600 }
.ph.done { background: var(--good-soft) } .ph.now { background: var(--info-soft) } .ph.bad { background: var(--bad-soft) }
.ph span { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650 }
td.r, th.r { text-align: right }
tr.click { cursor: pointer } tr.click:hover td { background: var(--soft) }
.scroll { overflow-x: auto }
pre { margin: 0; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; background: var(--soft); border-radius: 8px; padding: 10px }
details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--panel) }
details[open] { display: flex; flex-direction: column; gap: 8px }
summary { cursor: pointer; font-weight: 550 }
.box { background: var(--soft); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px }
ol.flow { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: s }
ol.flow > li { counter-increment: s; border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 12px 48px; position: relative; display: flex; flex-direction: column; gap: 4px }
ol.flow > li::before { content: counter(s); position: absolute; left: 12px; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; display: grid; place-items: center }
ol.flow > li.decision { border-style: dashed; border-color: var(--warn) }
ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: min(560px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .3) }
dialog::backdrop { background: rgba(10, 12, 20, .5) }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.seg button { border: 0; border-radius: 0; padding: 6px 12px; background: none }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent) }
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <span class="brand">Training camp</span>
    <select id="pick" aria-label="Camp"></select>
    <button id="newBtn">+ New camp</button>
  </div>
  <div id="main" class="col" style="gap:16px"></div>
</div>
<dialog id="newDlg">
  <form method="dialog" class="col">
    <h2>New training camp</h2>
    <p class="muted small">Say what the trained team should be able to do. The camp proposes a workflow and the agents for it; you can change it before anything is trained.</p>
    <label class="f"><b>Goal</b><textarea id="goal" placeholder="Build a VR app that people pay for every day"></textarea></label>
    <label class="f"><b>Name</b> optional<input id="name" maxlength="60"></label>
    <label class="f"><b>Your own idea of the steps</b> optional<textarea id="hint" placeholder="find demand, evaluate it, plan, small demos, evaluate demos, build the product, deliver"></textarea></label>
    <p class="small" id="createErr" style="color:var(--bad)"></p>
    <div class="row" style="justify-content:flex-end"><button value="cancel">Cancel</button><button id="create" class="primary" value="ok" type="button">Create and propose a workflow</button></div>
  </form>
</dialog>
<script>
const $ = id => document.getElementById(id)
/** Build an element. Text always goes in as text nodes, never as HTML: workflow and trial text comes from models. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (v == null || v === false) continue
    if (k === 'class') el.className = v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (k === 'value') el.value = v
    else el.setAttribute(k, v === true ? '' : v)
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)))
  return el
}
async function api(method, path, body) {
  let r
  // the browser's own words for an unreachable server ("Failed to fetch") say nothing: name what happened
  try { r = await fetch('api/' + path, { method, headers: { 'x-camp-request': '1', ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined }) }
  catch { const e = new Error('The harness did not answer. It may be restarting.'); e.offline = true; throw e }
  if (r.status === 401 || r.status === 403) { const e = new Error('Your session with the harness has ended. Reload this page from the harness sidebar.'); e.session = true; throw e }
  const j = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(j.error || r.statusText)
  return j
}

// ---------------------------------------------------------------- words
const pc = v => (v == null || Number.isNaN(Number(v)) ? '–' : Math.round(Number(v) * 100) + '%')
const SET = { train: 'Practice', dev: 'Check', holdout: 'Final exam' }
/** A tried configuration, in words: the original agent, or change 1A, 1B, 2A ... */
const ver = id => (!id || id === 'base' ? 'Original' : 'Change ' + String(id).split('-')[0].replace(/^[rt]/, '').toUpperCase().replace(/^S1M$/, 'S1 mix'))
const when = ts => (ts ? new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '')
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`
const STATUS = { draft: ['No workflow yet', ''], workflow: ['Workflow waits for you', 'warn'], approved: ['Ready to train', 'info'], training: ['Training', 'info'], paused: ['Paused', 'warn'], ready: ['Ready to publish', 'good'], 'not-passed': ['Finished, not all passed', 'bad'], published: ['Published', 'good'] }

// ---------------------------------------------------------------- state
const hash = location.hash.match(/^#(c[a-f0-9]{8})(?:@([a-z0-9_-]+))?$/)
const query = new URLSearchParams(location.search)
let current = hash ? hash[1] : null
let camps = [], camp = null, meta = null, steps = null
let active = {}       // { agent: trials } for agents being measured right now
let dirty = false     // the owner is typing: do not redraw under them
let message = null    // { text, tone }
let offline = null    // why the last refresh did not reach the harness; cleared by the next one that does
const ui = { tab: query.get('tab'), stage: query.get('stage'), agent: hash?.[2] ?? null, agentData: null, results: query.get('results') ?? 'agents', step: null, stepData: null, edit: false, versions: null, advanced: false }
if (ui.agent) ui.tab = 'agents'

const setHash = () => history.replaceState(null, '', current ? `#${current}${ui.agent ? '@' + ui.agent : ''}` : location.pathname)
async function act(fn, done) {
  message = null
  try { const r = await fn(); if (done) message = { text: typeof done === 'function' ? done(r) : done, tone: 'ok' } } catch (e) { message = { text: e.offline ? `${e.message} Nothing was changed; try again in a moment.` : e.message, tone: 'err' } }
  dirty = false
  await refresh(true)
}
const reading = () => !!document.querySelector('#main details[open]')

// ---------------------------------------------------------------- what the numbers mean
const wanted = c => { const all = c.workflow.roles.map(r => r.name); const pick = c.settings.roles ?? []; return pick.length ? all.filter(r => pick.includes(r)) : all }

/** Everything the page shows about progress, worked out once from the camp. */
function model(c) {
  const S = c.settings, names = wanted(c), all = names.length
  const st = r => c.roles[r] ?? {}
  const need = S.dataset.train + S.dataset.dev + S.dataset.holdout
  const running = c.run?.running ?? []
  const training = c.busy && c.active?.what === 'train'
  const agents = names.map(r => {
    const x = st(r), s = c.sets[r] ?? { train: 0, dev: 0, holdout: 0 }
    const written = Math.min(s.train, S.dataset.train) + Math.min(s.dev, S.dataset.dev) + Math.min(s.holdout, S.dataset.holdout)
    const rounds = x.rounds ?? [], kept = rounds.filter(k => k.accepted).length
    const coached = ['trained', 'verified'].includes(x.status)
    const now = training && running.some(a => String(a.label).split(':').includes(r))
    const role = c.workflow.roles.find(k => k.name === r)
    const works = c.workflow.stages.map((k, i) => (k.role === r ? { n: i + 1, title: k.title, as: 'does' } : k.reviewer === r ? { n: i + 1, title: k.title, as: 'reviews' } : null)).filter(Boolean)
    const frac = (written / need + (x.baseline ? 1 : 0) + (coached ? 1 : S.rounds ? Math.min(rounds.length / S.rounds, .9) * (x.baseline ? 1 : 0) : 0) + (x.verify ? 1 : 0)) / 4
    return { name: r, role, works, x, sets: s, written, need, tasksDone: written >= need, rounds, kept, coached, now, frac }
  })
  const count = f => agents.filter(f).length
  const team = S.team.enabled && c.workflow.stages.length > 1
  const sum = k => agents.reduce((a, g) => a + Math.min(g.sets[k], S.dataset[k]), 0)
  const stages = [
    ...(S.scout.enabled ? [{ k: 'scout', t: 'Find skills', what: 'For every agent, a scout looks on GitHub for skills that fit its role. Each find is reviewed, then installed or rejected with the reason.', frac: c.scout?.done ? 1 : 0, line: c.scout?.done ? `${(c.scout.skills ?? []).filter(x => x.status === 'installed').length} installed, ${(c.scout.skills ?? []).filter(x => x.status === 'rejected').length} rejected` : '' }] : []),
    { k: 'sets', t: 'Write tasks', what: `An examiner writes ${S.dataset.train} practice, ${S.dataset.dev} check and ${S.dataset.holdout} final-exam tasks for every agent.`, frac: all ? agents.reduce((a, g) => a + g.written / g.need, 0) / all : 0, line: `${count(g => g.tasksDone)} of ${all} agents` },
    { k: 'base', t: 'First scores', what: 'Each agent does its practice and check tasks as it is today, and a judge scores the work.', frac: all ? count(g => g.x.baseline) / all : 0, line: `${count(g => g.x.baseline)} of ${all} agents` },
    { k: 'rounds', t: 'Coaching', what: `Up to ${S.rounds} rounds per agent. A coach reads where the agent lost points and tries ${S.candidates} changes; a change is kept only if the agent then does better on the check tasks.`, frac: all ? count(g => g.coached) / all : 0, line: `${count(g => g.coached)} of ${all} agents` },
    { k: 'verify', t: 'Final exam', what: `Each agent does tasks it has never seen. It passes at ${pc(S.criteria.minScore)} or more.`, frac: all ? count(g => g.x.verify) / all : 0, line: count(g => g.x.verify) ? `${count(g => g.x.verify?.passed)} passed${count(g => g.x.verify && !g.x.verify.passed) ? `, ${count(g => g.x.verify && !g.x.verify.passed)} did not` : ''}` : `0 of ${all} agents` },
    ...(team ? [{ k: 'team', t: 'Team practice', what: 'The whole team runs the workflow on small goals. Hand-offs and reviews are tuned, then the team takes its own final exam.', frac: c.team?.verify ? 1 : c.team?.baseline ? .5 : (c.sets._team?.dev ?? 0) ? .2 : 0, line: c.team?.verify ? (c.team.verify.passed ? `passed, ${pc(c.team.verify.score)}` : `not passed, ${pc(c.team.verify.score)}`) : c.team?.baseline ? `first score ${pc(c.team.baseline.dev)}` : '' }] : []),
    { k: 'publish', t: 'Publish', what: 'You publish the agents that passed, their teams and the workflow into Agent Forge.', frac: c.published ? 1 : 0, line: c.published ? when(c.published.ts) : c.status === 'ready' ? 'ready for you' : '' },
  ]
  const cur = stages.findIndex(x => x.frac < 1)
  const work = stages.filter(x => x.k !== 'publish')
  return { S, names, all, agents, stages, cur, training, running, team, overall: work.reduce((a, x) => a + x.frac, 0) / work.length, sum, count }
}

/** What one running model call is doing, in words. */
function sayCall(label, c) {
  const p = String(label).split(':')
  const set = { train: 'practice', dev: 'check', holdout: 'final-exam' }
  if (p[0] === 'examiner' || p[0] === 'sealer') return p[1] === '_team' ? `Writing ${set[p[2]] ?? p[2]} goals for the whole team` : `Writing ${set[p[2]] ?? p[2]} tasks for ${p[1]}`
  if (p[0] === 'judge') return p[1] === 'team' ? 'The judge is scoring a team run' : `The judge is scoring a task of ${p[1]}`
  if (p[0] === 'coach') return p[1] === 'team' ? 'The coach is looking for a better hand-off in the team' : `The coach is reading where ${p[1]} lost points (round ${p[2]})`
  if (p[0] === 'scout') return 'The scout is looking for useful skills on GitHub'
  if (p[0] === 'team') return `Team run: ${p[4] ?? 'an agent'} is on step "${p[3] ?? ''}"`
  if (p[0].startsWith('architect')) return 'The architect is working on the workflow'
  if (c.roles?.[p[0]]) return `${p[0]} is doing a task (${ver(p[1]).toLowerCase()})`
  return label
}

// ---------------------------------------------------------------- hero: where it stands and what to press
function hero(c, m) {
  const B = (label, fn, cls = 'primary') => h('button', { class: cls, onclick: fn }, label)
  const post = (path, body, done) => () => act(() => api('POST', `camps/${c.id}/${path}`, body ?? {}), done)
  const train = label => B(label, post('train', {}, 'Training is running.'))
  const [word, tone0] = STATUS[c.status] ?? [c.status, '']
  let say, sub = null, btn = [], tone = tone0
  if (c.busy && m?.training) {
    const s = m.stages[m.cur] ?? m.stages.at(-2)
    say = `Training is running: step ${Math.min(m.cur, m.stages.length - 1) + 1} of ${m.stages.length}, ${s.t.toLowerCase()}.`
    sub = `${s.line ? s.line + ' done. ' : ''}You can pause at any time; finished work is kept.`
    btn = [B('Pause training', post('cancel', {}, 'Pausing. Press "Resume training" to continue from where it stopped.'), '')]
  } else if (c.busy) {
    say = 'The architect is working on the workflow. This takes a few minutes.'
    btn = [B('Stop', post('cancel', {}, 'Stopping.'), '')]
  } else if (c.status === 'draft') {
    say = 'This camp has no workflow yet.'
    btn = [B('Propose a workflow', post('propose', {}, 'The architect is working; this takes a few minutes.'))]
  } else if (c.status === 'workflow') {
    say = `Workflow version ${c.workflowVersion} is waiting for you.`
    sub = 'Read it on the Workflow tab. Ask for changes there, or approve it. Nothing is trained until you approve.'
    btn = [B('Approve this workflow', post('approve', {}, r => `Approved.${r.kept.length ? ' Kept the training of: ' + r.kept.join(', ') + '.' : ''} Press "Start training".`)), B('Read the workflow', () => { ui.tab = 'workflow'; render() }, '')]
  } else if (c.status === 'approved') {
    const started = m && m.overall > 0
    say = started ? `Training is stopped at "${m.stages[m.cur]?.t}". Finished work is kept.` : `Ready to train ${plural(m.all, 'agent')}.`
    sub = started ? null : 'Training makes many model calls and can take hours. It pauses by itself at the budget or at a model limit, and continues later from where it stopped.'
    btn = [train(started ? 'Continue training' : 'Start training')]
  } else if (c.status === 'training' || c.status === 'paused') {
    const why = c.pause?.reason ?? 'the harness stopped while training ran'
    say = /you paused/.test(why) || why === 'cancelled' ? 'You paused the training.' : 'Training has paused.'
    const manual = /you paused|cancelled/.test(why) && (c.pause?.by || !c.watched)
    const limit = /budget|call limit|model calls/i.test(why) && !/429|quota|rate.?limit|usage limit/i.test(why)

        [[s.role, 'Done by'], ...(s.reviewer ? [[s.reviewer, `Checked by (${s.reviewRounds} round${s.reviewRounds === 1 ? '' : 's'})`]] : [])].map(([r, label]) => person(c, s, r, label)),
        h('span', null, s.purpose),
        h('details', null, h('summary', { class: 'small' }, 'What it delivers and when it is accepted'), h('p', { class: 'small' }, h('b', null, 'Delivers: '), s.deliverable), s.inputs.length ? h('p', { class: 'small' }, h('b', null, 'Reads the results of: '), s.inputs.join(', ')) : null, h('ul', { class: 'plain small' }, s.acceptance.map(a => h('li', null, a)))))))),
    h('div', { class: 'card' }, h('h2', null, 'Teams'),
      wf.teams.length ? h('div', { class: 'grid' }, wf.teams.map(t => h('div', { class: 'box' }, h('b', null, t.name), t.description ? h('span', { class: 'small muted' }, t.description) : null, h('div', { class: 'row' }, t.members.map(n => h('span', { class: 'tag' }, n)))))) : h('p', { class: 'muted' }, 'No teams in this workflow.')),
  ]
}

// ---------------------------------------------------------------- Results
function resultsTab(c, m) {
  const seg = h('div', { class: 'seg' }, [['agents', 'By agent'], ['steps', 'By workflow step']].map(([k, t]) => h('button', { 'aria-pressed': ui.results === k ? 'true' : 'false', onclick: async () => { ui.results = k; ui.step = null; if (k === 'steps') steps = await api('GET', `camps/${c.id}/steps`).catch(() => null); render() } }, t)))
  const passed = m.count(g => g.x.verify?.passed), examined = m.count(g => g.x.verify)
  const head = h('div', { class: 'row between' }, h('h2', null, examined ? `${passed} of ${m.all} agents passed the final exam` : 'No agent has taken its final exam yet'), seg)
  if (ui.results === 'steps') return [h('div', { class: 'card' }, head, stepsView(c))]
  const row = g => { const v = g.x.verify; return h('tr', { class: 'click', onclick: () => openAgent(g.name) },
    h('td', null, h('b', null, g.name), h('div', { class: 'small muted' }, g.works.map(w => `step ${w.n}`).join(', '))),
    h('td', { class: 'r num' }, pc(g.x.baseline?.dev)), h('td', { class: 'r num' }, g.coached ? h('b', null, pc(g.x.best?.dev)) : '–'),
    h('td', { class: 'small' }, g.kept ? g.rounds.filter(q => q.accepted).map(q => q.candidates.find(z => z.id === q.promoted)?.lever).join(', ') : g.coached ? 'nothing needed changing' : '–'),
    h('td', { class: 'r num' }, v ? h('b', null, pc(v.score)) : '–'),
    h('td', null, v ? h('span', { class: 'chip ' + (v.passed ? 'good' : 'bad') }, v.passed ? 'Passed' : 'Not passed') : h('span', { class: 'muted small' }, agentLine(g)), v?.reasons?.length ? h('div', { class: 'small muted' }, v.reasons.join(' ')) : null)) }
  const t = c.team ?? {}
  return [h('div', { class: 'card' }, head,
    h('p', { class: 'small muted' }, `The pass mark is ${pc(m.S.criteria.minScore)} on the final exam. Click an agent for everything behind its numbers.`),
    h('div', { class: 'scroll' }, h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Agent'), h('th', { class: 'r' }, 'First score'), h('th', { class: 'r' }, 'After coaching'), h('th', null, 'What was changed'), h('th', { class: 'r' }, 'Final exam'), h('th', null, 'Result'))),
      h('tbody', null, m.agents.map(row),
        m.team ? h('tr', null, h('td', null, h('b', null, 'The whole team'), h('div', { class: 'small muted' }, 'runs the complete workflow')), h('td', { class: 'r num' }, pc(t.baseline?.dev)), h('td', { class: 'r num' }, t.best ? h('b', null, pc(t.best.dev)) : '–'), h('td', { class: 'small' }, t.best && t.best.id !== 'base' ? 'hand-offs and reviews tuned' : t.baseline ? 'workflow as approved' : '–'), h('td', { class: 'r num' }, t.verify ? h('b', null, pc(t.verify.score)) : '–'), h('td', null, t.verify ? h('span', { class: 'chip ' + (t.verify.passed ? 'good' : 'bad') }, t.verify.passed ? 'Passed' : 'Not passed') : h('span', { class: 'muted small' }, 'after the agents'), t.verify?.reasons?.length ? h('div', { class: 'small muted' }, t.verify.reasons.join(' ')) : null)) : null))))]
}

function stepsView(c) {
  if (!steps) return h('p', { class: 'muted' }, 'Loading…')
  return h('ol', { class: 'flow' }, steps.map(s => h('li', { class: s.kind === 'decision' ? 'decision' : null },
    h('div', { class: 'row' }, h('b', null, s.title), s.kind === 'decision' ? h('span', { class: 'chip warn' }, 'Go or stop decision') : null),
    s.people.map(p => { const sc = p.scores
      return h('div', { class: 'col', style: 'gap:6px; border-top:1px solid var(--line); padding-top:8px' },
        h('div', { class: 'row' }, h('button', { class: 'ghost', onclick: () => openAgent(p.role) }, p.role), h('span', { class: 'tag' }, p.as === 'owner' ? 'does this step' : 'checks this step'),
          p.verdict ? h('span', { class: 'chip ' + (p.verdict.passed ? 'good' : 'bad') }, p.verdict.passed ? 'Agent passed' : 'Agent did not pass') : null),
        h('div', { class: 'small num' }, `Tasks for this step: ${p.counts.train} practice, ${p.counts.dev} check, ${p.counts.holdout} final exam${p.shared ? ' (shared with this agent\'s other steps)' : ''}`),
        h('div', { class: 'small num' }, 'Score on this step: ', h('b', null, `${pc(sc.baselineDev)} at first → ${pc(sc.bestDev)} after coaching → ${pc(sc.sealed)} in the final exam`)),
        p.done.length ? h('details', { ontoggle: async e => { const box = e.target.querySelector('.trials'); if (!e.target.open || !box || box.dataset.loaded) return; box.dataset.loaded = '1'; const rows = await api('GET', `camps/${c.id}/details/${p.role}?stage=${encodeURIComponent(s.id)}`).catch(() => []); box.replaceChildren(...(rows.length ? rows.map(trialView) : [h('p', { class: 'muted small' }, 'Nothing marked yet.')])) } },
          h('summary', { class: 'small' }, 'What was done, and every marked task of this step'), h('ul', { class: 'plain small' }, p.done.map(d => h('li', null, d))), h('div', { class: 'col trials', style: 'gap:6px' }, h('p', { class: 'muted small' }, 'Loading…'))) : h('span', { class: 'small muted' }, 'Nothing done yet for this step.')) }))))
}

// ---------------------------------------------------------------- Settings
function settingsTab(c) {
  const S = c.settings
  const key = (prov, mod) => `${prov || 'claude-code'}|${mod}`
  const opts = (meta?.providers ?? []).flatMap(p => p.models.map(mo => ({ v: key(p.id, mo), label: `${p.free ? 'Free' : p.label}: ${mo}${p.ready ? '' : ' (not set up)'}`, ready: p.ready })))
  const d = S.staff.default ?? {}
  const of = o => key(o?.provider ?? d.provider, o?.model ?? d.model)
  const pick = (id, label, help, cur) => { const all = opts.some(o => o.v === cur) ? opts : [{ v: cur, label: cur.replace('|', ': ') + ' (current)', ready: true }, ...opts]; return h('label', { class: 'f' }, h('b', null, label), help, h('select', { id, onchange: () => { dirty = true } }, all.map(o => h('option', { value: o.v, selected: o.v === cur, disabled: !o.ready }, o.label)))) }
  const read = id => { const [provider, ...mo] = $(id).value.split('|'); return { provider, model: mo.join('|') } }
  const num = (id, label, help, val, attrs = {}) => h('label', { class: 'f' }, h('b', null, label), help, h('input', { id, type: 'number', value: val, oninput: () => { dirty = true }, ...attrs }))
  const n = id => Number($(id).value)
  return [
    h('div', { class: 'card' }, h('h2', null, 'Models'), h('p', { class: 'muted' }, 'Which model does which job in this camp. After publishing you can change any agent\'s model on the Agents page of Agent Forge.'),
      h('div', { class: 'row', style: 'align-items:flex-start' },
        pick('m-train', 'Agents train on', 'every agent runs its tasks on this model and is published with it', key(S.trainee.provider, S.trainee.model)),
        pick('m-staff', 'Camp staff', 'the architect, the task writer and the coach', of(d))),
      h('div', { class: 'row', style: 'align-items:flex-start' },
        pick('m-judge', 'Judge', 'marks every task; best on a stronger, different model', of(S.staff.judge)),
        pick('m-sealer', 'Final-exam writer', 'writes the tasks nobody else sees', of(S.staff.sealer))),
      h('div', { class: 'row' }, h('button', { disabled: c.busy, onclick: () => { const t = read('m-train'), st = read('m-staff'), j = read('m-judge'), se = read('m-sealer'); act(() => api('PUT', `camps/${c.id}/settings`, { trainee: { backend: 'claude-code', provider: t.provider, model: t.model, effort: S.trainee.effort ?? 'high', override: true }, staff: { default: { backend: 'claude-code', provider: st.provider, model: st.model, effort: d.effort ?? 'medium' }, judge: { provider: j.provider, model: j.model }, sealer: { provider: se.provider, model: se.model } }, allowedModels: meta.providers.find(p => p.id === t.provider)?.models ?? [t.model] }), 'Models saved. Agents that have no first score yet use them straight away; train an agent again to move one that already has scores.') } }, 'Save models'))),
    h('div', { class: 'card' }, h('h2', null, 'How much training'),
      h('div', { class: 'row', style: 'align-items:flex-start' },
        num('s-train', 'Practice tasks', 'per agent', S.dataset.train, { min: 2, max: 60 }), num('s-dev', 'Check tasks', 'per agent', S.dataset.dev, { min: 2, max: 60 }), num('s-hold', 'Final-exam tasks', 'per agent', S.dataset.holdout, { min: 2, max: 60 })),
      h('div', { class: 'row', style: 'align-items:flex-start' },
        num('s-rounds', 'Coaching rounds', 'at most, per agent', S.rounds, { min: 0, max: 20 }), num('s-cands', 'Changes per round', 'the coach tries this many', S.candidates, { min: 1, max: 6 }), num('s-pass', 'Pass mark', 'percent in the final exam', Math.round(S.criteria.minScore * 100), { min: 0, max: 100 })),
      h('div', { class: 'row', style: 'align-items:flex-start' },
        num('s-agents', 'Agents at once', 'trained side by side', S.parallelAgents ?? 4, { min: 1, max: 32 }), num('s-calls', 'Model calls at once', 'more is faster, until the model slows you down', S.parallelCalls ?? 8, { min: 1, max: 48 }), num('s-budget', 'Budget in dollars', 'training pauses when the estimate reaches it', S.budgetUsd, { min: 0, step: 1 })),
      h('label', { class: 'row small' }, h('input', { id: 's-team', type: 'checkbox', style: 'width:auto', ...(S.team.enabled ? { checked: true } : {}), onchange: () => { dirty = true } }), 'Also train the whole team on small end-to-end goals'),
      h('div', { class: 'row' }, h('button', { onclick: () => act(() => api('PUT', `camps/${c.id}/settings`, { dataset: { train: n('s-train'), dev: n('s-dev'), holdout: n('s-hold') }, rounds: n('s-rounds'), candidates: n('s-cands'), criteria: { minScore: n('s-pass') / 100 }, parallelAgents: n('s-agents'), parallelCalls: n('s-calls'), budgetUsd: n('s-budget'), team: { enabled: $('s-team').checked } }), 'Saved. Changes to parallel work apply the next time training starts.') }, 'Save'),
        h('span', { class: 'small muted' }, 'More tasks and rounds mean better training and more model calls.'))),
    h('details', { ontoggle: e => { ui.advanced = e.target.open }, ...(ui.advanced ? { open: true } : {}) }, h('summary', null, 'All settings (advanced)'),
      h('textarea', { class: 'code', id: 'settings', spellcheck: 'false', value: JSON.stringify(S, null, 2), oninput: () => { dirty = true } }),
      h('div', { class: 'row' }, h('button', { onclick: () => { let v; try { v = JSON.parse($('settings').value) } catch (e) { message = { text: 'The text is not valid JSON: ' + e.message, tone: 'err' }; return render() } act(() => api('PUT', `camps/${c.id}/settings`, v), 'Settings saved.') } }, 'Save all settings'))),
    h('div', { class: 'card' }, h('h2', null, 'Start over'),
      h('div', { class: 'row' }, h('button', { class: 'danger', disabled: c.busy, onclick: () => { if (confirm('Start this camp fresh?\n\nKept: the goal, the settings and the approved workflow.\nCleared: all tasks, scores, coaching rounds, final-exam results, the scout\'s result, the spend counter and the log.\n\nPublished agents are not touched.')) { ui.agent = null; ui.agentData = null; act(() => api('POST', `camps/${c.id}/fresh`, {}), 'The camp is fresh. Press "Start training".') } } }, '↻ Start this camp fresh'),
        h('span', { class: 'small muted' }, 'Keeps the goal, settings and workflow. Clears tasks, scores and coaching.')),
      h('div', { class: 'row' }, h('button', { class: 'danger', disabled: c.busy, onclick: () => { if (confirm('Delete this camp with all its tasks and results?\n\nPublished agents stay in Agent Forge.')) act(async () => { await api('DELETE', `camps/${c.id}`); current = null; camp = null; setHash() }) } }, 'Delete this camp'),
        h('span', { class: 'small muted' }, c.busy ? 'Pause the training first.' : 'Removes the camp. Published agents stay.'))),
  ]
}

// ---------------------------------------------------------------- page
function render() {
  const pick = $('pick')
  pick.replaceChildren(...(camps.length ? camps.map(k => h('option', { value: k.id, selected: k.id === current }, `${k.name} · ${k.busy ? 'working' : (STATUS[k.status]?.[0] ?? k.status)}`)) : [h('option', { value: '' }, 'No camps yet')]))
  const main = $('main')
  const c = camp
  if (!c) return main.replaceChildren(h('div', { class: 'card' }, offline ? h('div', { class: 'note' }, offline) : null, h('h2', null, offline && !camps.length ? 'Waiting for the harness' : camps.length ? 'Choose a camp above' : 'No training camp yet'), h('p', { class: 'muted' }, 'A training camp takes one goal, proposes a workflow and the agents for it, trains each agent and the team on generated tasks, tests them on tasks they have never seen, and lets you publish the ones that pass.'), message ? h('div', { class: 'note ' + message.tone }, message.text) : null, h('div', { class: 'row' }, h('button', { class: 'primary', onclick: () => $('newDlg').showModal() }, '+ New camp'))))
  const usable = !!c.workflow && c.approvedVersion === c.workflowVersion
  const m = c.workflow ? model(c) : null
  const tabs = [['overview', 'Overview'], ['agents', `Agents${m ? ' (' + m.all + ')' : ''}`], ['workflow', 'Workflow'], ['results', 'Results'], ['settings', 'Settings']]
  if (!usable && !['workflow', 'settings'].includes(ui.tab)) ui.tab = 'workflow'
  ui.tab ??= 'overview'
  const body = ui.tab === 'overview' ? overviewTab(c, m) : ui.tab === 'agents' ? agentsTab(c, m) : ui.tab === 'results' ? resultsTab(c, m) : ui.tab === 'settings' ? settingsTab(c) : workflowTab(c)
  main.replaceChildren(hero(c, usable ? m : null),
    h('div', { class: 'tabs', role: 'tablist' }, tabs.map(([k, t]) => h('button', { role: 'tab', 'aria-selected': ui.tab === k ? 'true' : 'false', disabled: !usable && !['workflow', 'settings'].includes(k), title: !usable && !['workflow', 'settings'].includes(k) ? 'Approve the workflow first' : null, onclick: () => { ui.tab = k; if (k !== 'agents') { ui.agent = null; ui.agentData = null; setHash() } dirty = false; render() } }, t))),
    ...[body].flat().filter(Boolean))
}

async function refresh(force) {
  try {
    meta ??= await api('GET', 'meta')
    camps = (await api('GET', 'camps')).camps
    if (!current && camps.length) { current = camps[0].id; setHash() }
    if (current && !camps.some(k => k.id === current)) { current = camps[0]?.id ?? null; camp = null; setHash() }
    if (current) {
      camp = await api('GET', `camps/${current}`)
      if (camp.workflow && camp.busy) {
        const live = wanted(camp).filter(r => { const x = camp.roles[r] ?? {}; return !x.baseline && (camp.sets[r]?.holdout ?? 0) > 0 }).slice(0, 8)
        active = Object.fromEntries(await Promise.all(live.map(async r => [r, await api('GET', `camps/${current}/trials/${r}`).catch(() => [])])))
      } else active = {}
      if ((ui.tab === 'results' && ui.results === 'steps') || ui.tab === 'workflow' || !steps) steps = await api('GET', `camps/${current}/steps`).catch(() => null)
      if (ui.agent && (force || !reading())) await loadAgent()
    } else camp = null
    offline = null
  } catch (e) {
    // not reaching the harness is a state of the page, not a result of something you did: it clears itself
    if (e.offline || e.session) offline = e.session ? e.message : `${e.message} This page tries again every 5 seconds${camp ? '; what you see below is the last state it read' : ''}.`
    else message = { text: e.message, tone: 'err' }
  }
  if (force || (!dirty && !reading())) render()
}

$('pick').addEventListener('change', e => { current = e.target.value || null; camp = null; steps = null; message = null; Object.assign(ui, { tab: null, stage: null, agent: null, agentData: null, step: null, edit: false, versions: null }); dirty = false; setHash(); refresh(true) })
$('newBtn').addEventListener('click', () => $('newDlg').showModal())
$('create').addEventListener('click', async () => {
  $('createErr').textContent = ''
  try {
    const c = await api('POST', 'camps', { goal: $('goal').value, name: $('name').value, hint: $('hint').value })
    await api('POST', `camps/${c.id}/propose`, {})
    $('goal').value = ''; $('name').value = ''; $('hint').value = ''
    $('newDlg').close()
    current = c.id; camp = null; Object.assign(ui, { tab: 'workflow', agent: null, agentData: null }); setHash()
    message = { text: 'The architect is proposing a workflow. This takes a few minutes; the page updates by itself.', tone: 'ok' }
    refresh(true)
  } catch (e) { $('createErr').textContent = e.message }
})
refresh(true)
setInterval(() => { if (!document.hidden) refresh(false) }, 5000)
</script>
